name: Refresh contribution graph

on:
  workflow_dispatch:
  schedule:
    # Daily at 00:17 UTC / 05:17 PKT.
    - cron: "17 0 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate_activity.py"
      - ".github/workflows/activity.yml"

permissions:
  contents: write

concurrency:
  group: readme-contribution-graph
  cancel-in-progress: true

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate animated contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: python scripts/generate_activity.py

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh contribution graph"
          git pull --rebase origin main
          git push
